# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
conflict:
  not-enabled: "<gray>PvP and raiding aren't opt-in on this server - the server's own rules apply."
  only-a-player: "<red>Only a player picks fights."
  unknown-player: "<red>Never heard of <white><player></white>."
  locked: "<red>Not yet.</red> <gray>You can change that again in <white><time></white> - once every <days> days, so nobody bails out right after an attack."
  locked-until: "<dark_gray>You can change it again in <time>."
  no-pvp: "<gray>No fighting: PvP is opt-in here and you two haven't both chosen it. <white>/pvp</white>"
  pvp-usage: "<gray>/pvp <dark_gray>— where you stand · <gray>/pvp on | off"
  pvp-status-on: "<gray>PvP is <red>on</red> for you: whoever else chose it can fight you, and you them."
  pvp-status-off: "<gray>PvP is <green>off</green> for you: nobody can hurt you, you can't hurt anybody. <white>/pvp on</white> if you get bored."
  pvp-status-raiding: "<gray>PvP is <red>on</red> for you because you raid - raiders can always be hit back."
  pvp-already-on: "<gray>PvP is already on for <white><player></white>."
  pvp-already-off: "<gray>PvP is already off for <white><player></white>."
  pvp-switched-on: "<red>PvP is on.</red> <gray>Anybody else who chose it can fight you now. This stays for <white><days></white> days."
  pvp-switched-off: "<green>PvP is off.</green> <gray>Peace and quiet - for at least <white><days></white> days."
  pvp-others-on: "<red>PvP is on for <white><player></white>."
  pvp-others-off: "<green>PvP is off for <white><player></white>."
  pvp-switch-off: "<gray>There's no PvP switch on this server - PvP follows the server's and the claims' own rules."
  raid-brings-pvp: "<dark_gray>PvP comes with raiding: raiders can always be hit back."
  pvp-held-by-raiding: "<yellow>Still on while raiding is on: raiders can always be hit back."
  raid-usage: "<gray>/raid <dark_gray>— where you stand · <gray>/raid on | off"
  raid-status-on: "<gray>Raiding is <red>on</red>: you may break into other raiders' claims as if they were yours - and they into yours."
  raid-status-off: "<gray>Raiding is <green>off</green>: your claims are closed to everybody, and so are theirs to you."
  raid-already-on: "<gray>Raiding is already on for <white><player></white>."
  raid-already-off: "<gray>Raiding is already off for <white><player></white>."
  raid-switched-on: "<red>Raiding is on.</red> <gray>Other raiders' claims are open to you - and yours to them, TNT included. This stays for <white><days></white> days. Good luck."
  raid-switched-off: "<green>Raiding is off.</green> <gray>Your claims are yours alone again - for at least <white><days></white> days."
  raid-others-on: "<red>Raiding is on for <white><player></white>."
  raid-others-off: "<green>Raiding is off for <white><player></white>."
